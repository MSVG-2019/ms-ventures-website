name: J’adore Private Test Preview

on:
  push:
    branches: [codex/jadore-test]
    paths:
      - 'jadore-test/**'
      - '.github/workflows/jadore-private-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jadore-private-test
  cancel-in-progress: true

jobs:
  review-and-deploy:
    if: github.ref == 'refs/heads/codex/jadore-test' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the isolated test branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 3 October 2026
        with:
          persist-credentials: false
      - name: Verify the frozen private preview and production boundary
        run: python3 jadore-test/verify_preview.py
      - name: Upload only the separate named test environment
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1, verified 3 October 2026
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_POND_0FC80AF03 }}
          action: upload
          deployment_environment: jadoretest
          production_branch: main
          app_location: jadore-test/website
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
